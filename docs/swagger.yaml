        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get rental
      tags:
      - admin-rentals
    patch:
      consumes:
      - application/json
      description: Updates a rental by ID (admin only)
      parameters:
      - description: Rental ID
        in: path
        name: rental_id
        required: true
        type: integer
      - description: Rental data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/pedalea.RentalData'
      produces:
