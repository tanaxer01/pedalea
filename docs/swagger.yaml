          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List available bikes
      tags:
      - bikes
  /rentals/end:
    get:
      consumes:
      - application/json
      description: Ends the current rental for the authenticated user
      parameters:
      - description: Rental end payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/pedalea.EndRental'
      produces:
