        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: List rentals
      tags:
      - admin-rentals
  /admin/rentals/{rental_id}:
    get:
      description: Gets a rental by ID (admin only)
      parameters:
      - description: Rental ID
        in: path
        name: rental_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Rental data in data
          schema:
            allOf:
            - $ref: '#/definitions/utils.DataResponse'
            - properties:
                data:
